[project]
name = "filings-qa"
version = "0.1.0"
description = "A question-answering agent over SEC 10-K filings that cites every claim, with an evaluation harness that measures whether you can trust it."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mariam Ali" }]
dependencies = [
    "anthropic>=0.40",
    "beautifulsoup4>=4.12",
    "fastapi>=0.110",
    "httpx>=0.27",
    "langgraph>=0.2",
    "numpy>=1.26",
    "pgvector>=0.3",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
# Local embeddings (no API key needed). Heavy: pulls in PyTorch.
local-embeddings = ["sentence-transformers>=2.7"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
filings-qa = "filings_qa.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # line length is handled by the formatter
